[package]
name = "dev-core-tools"
version = "1.2.0"
description = "Dev Core Tools — 30 local-first developer tools, one window."
authors = ["Dev Core Tools Contributors"]
license = "MIT"
repository = "https://github.com/bolorundurowb/dev-core-tools"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "dev_core_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-process = "2.3.1"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Image processing
image = { version = "0.25.10", features = ["png", "jpeg", "webp", "avif", "ico"] }

# Crypto
sha1 = "0.11.0"
sha2 = "0.11.0"
md-5 = "0.11.0"
crc32fast = "1.5.0"
hmac = "0.13.0"
bcrypt = "0.19.2"
hex = "0.4.3"

# Async
tokio = { version = "1", features = ["full"] }

# HTTP (NuGet API)
reqwest  = { version = "0.13.4", features = ["json", "native-tls"] }
futures  = "0.3.33"
thiserror = "2.0.19"

[profile.release]
panic = "abort"  # Strip expensive panic clean-up logic
codegen-units = 1
lto = true
opt-level = "s"
